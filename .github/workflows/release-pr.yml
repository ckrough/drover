name: Release PR

# Rolling release-PR generator. Uses python-semantic-release to compute
# the next version, bumps pyproject.toml + CHANGELOG.md on a sticky
# "chore/release" branch, and opens or updates a PR labeled "release".
# Merging the labeled PR triggers release.yml, which tags and publishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: Open or update release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      RELEASE_BRANCH: chore/release
      PSR_VERSION: "10.5.3"

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - name: Install python-semantic-release
        run: pip install "python-semantic-release==${PSR_VERSION}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: psr
        run: |
          set +e
          next=$(semantic-release version --print 2>/dev/null)
          rc=$?
          set -e
          if [ $rc -ne 0 ] || [ -z "$next" ]; then
            echo "No release-worthy commits since last tag; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$next" = "$current" ]; then
            echo "Next version equals current ($current); nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump version and changelog
        if: steps.psr.outputs.skip != 'true'
        run: |
          semantic-release version --no-push --no-tag --no-vcs-release --skip-build

      - name: Push release branch
        if: steps.psr.outputs.skip != 'true'
        env:
          BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |
          git branch -f "$BRANCH"
          git push --force-with-lease origin "$BRANCH"

      - name: Write PR description
        if: steps.psr.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.psr.outputs.next }}
        run: |
          {
            echo "Automated release pull request."
            echo
            echo "- Version: v${NEXT}"
            echo "- Bumps pyproject.toml and CHANGELOG.md via python-semantic-release."
            echo
            echo "Merging this PR triggers release.yml, which creates the v${NEXT} tag and a GitHub Release. No PyPI publish step is configured."
          } > pr_description.txt

      - name: Open or update release PR
        if: steps.psr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ env.RELEASE_BRANCH }}
          NEXT: ${{ steps.psr.outputs.next }}
        run: |
          title="chore(release): v${NEXT}"
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file pr_description.txt --add-label release
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file pr_description.txt --label release
          fi
